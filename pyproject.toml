[tool.poetry]
name = "python_template"
version = "0.1.0"
description = "Python template project with tests and C extensions."
authors = ["LinHeLurking"]
license = "MIT"
readme = "README.md"
include = [
    { path = "csrcs", format = "sdist" },
    { path = "python_template/ext*.so", format = "wheel" },
    { path = "python_template/ext*.dll", format = "wheel" },
    { path = "python_template/ext*.pyd", format = "wheel" },
    { path = "python_template/ext*.pyi", format = [
        "wheel",
        "sdist",
    ] },
]

[tool.isort]
profile = "black"

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pybind11 = "^2.13.5"
pytest = "^8.3.2"
pre-commit = "^3.8.0"
tomli = "^2.2.1"
tomli-w = "^1.1.0"
scikit-build-core = "^0.10.7"

[tool.scikit-build.cmake]
source-dir = "csrcs"

[build-system]
requires = ["poetry-core", "pybind11", "tomli", "tomli_w", "scikit-build-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.build]
generate-setup-file = false
script = "ext_build.py"
